version: "3.8"
services:
  postgres:
    image: postgres:16-alpine
    container_name: ridelocal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ridelocal
      POSTGRES_PASSWORD: ridelocal
      POSTGRES_DB: ridelocal
    ports:
      - "5432:5432"
    volumes:
      - ridelocal_pgdata:/var/lib/postgresql/data

volumes:
  ridelocal_pgdata:
